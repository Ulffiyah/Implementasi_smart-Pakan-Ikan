sonar.projectKey=Ulffiyah_Implementasi_smart-Pakan-Ikan
sonar.organization=ulffiyah

# Location of source code
sonar.sources=src
sonar.exclusions=src/**/*.test.jsx,src/**/*.test.js,src/setupTests.js

# Test Coverage report location
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# File yang tidak dihitung untuk coverage
sonar.coverage.exclusions=src/main.jsx,src/**/*.test.jsx,src/**/*.test.js,src/setupTests.js
sonar.coverage.exclusions=src/main.jsx,src/supabaseClient.js,src/**/*.test.jsx,src/**/*.test.js,src/setupTests.js
